name: 💡 Feature Request
description: Suggest an idea, enhancement, or new feature for Compositor
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Compositor!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement or Use Case
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe what you would like to see happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.

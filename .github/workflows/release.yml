name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0-alpha01)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Install Dependencies & Build Web Viewer
        run: |
          cd web-viewer-react
          npm ci
          npm run build

      - name: Package VS Code Extension (.vsix)
        run: |
          cd vscode-extension
          npm ci
          npm run build
          TAG="${{ inputs.tag_name || github.ref_name }}"
          npx @vscode/vsce package --no-dependencies --out "compositor-preview-${TAG}.vsix"

      - name: Build Gradle Artifacts
        env:
          GRADLE_OPTS: "-Dorg.gradle.java.home=${{ env.JAVA_HOME }}"
        run: |
          ./gradlew :core-renderer:assemble :plugin:assemble --no-daemon

      - name: Publish VS Code Extension to Marketplace (if token configured)
        if: env.VSCE_PAT != ''
        run: |
          cd vscode-extension
          TAG="${{ inputs.tag_name || github.ref_name }}"
          npx @vscode/vsce publish --packagePath "compositor-preview-${TAG}.vsix"

      - name: Publish VS Code Extension to Open VSX (if token configured)
        if: env.OVSX_PAT != ''
        run: |
          cd vscode-extension
          TAG="${{ inputs.tag_name || github.ref_name }}"
          npx ovsx publish "compositor-preview-${TAG}.vsix" -p ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release & Upload VSIX Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Compositor ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            vscode-extension/*.vsix

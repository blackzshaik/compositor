name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Lint & Detekt Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Detekt Static Analysis
        env:
          GRADLE_OPTS: "-Dorg.gradle.java.home=${{ env.JAVA_HOME }}"
        run: ./gradlew detekt --no-daemon

  build-and-test-kotlin:
    name: Build & Test (Kotlin & Gradle Plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Viewer Bundle
        run: |
          cd web-viewer-react
          npm ci
          npm run build

      - name: Compile and Run Scoped Unit Tests
        env:
          GRADLE_OPTS: "-Dorg.gradle.java.home=${{ env.JAVA_HOME }}"
        run: ./gradlew :plugin:test :core-renderer:compileKotlin --no-daemon

  build-and-test-web-and-extension:
    name: Web Viewer & VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test & Build Web Viewer (React)
        run: |
          cd web-viewer-react
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build

      - name: Test & Build VS Code Extension
        run: |
          cd vscode-extension
          npm ci
          npm run typecheck
          npm run lint
          npm run test
          npm run build
